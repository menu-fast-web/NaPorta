<div class="min-h-screen flex flex-col lg:flex-row">
  <div class="hidden lg:flex lg:w-1/2 bg-blue-800 flex-col justify-between px-4 py-8">
    <p class="text-sm text-gray-200 max-w-xs">Peça sua refeição sem sair do quarto.</p>
    <img src="assets/images/logo-white.svg" alt="Logo" class="w-full" />
    <p class="text-sm text-gray-200 self-end">NaPorta, 2026</p>
  </div>

  <div class="flex flex-1 items-center justify-center bg-gray-50 px-6 py-12 lg:px-8 border-l-4 border-blue-400">
    <div class="w-full max-w-sm flex flex-col gap-6">

      <img src="assets/images/logo.svg" alt="Logo" class="w-24 lg:hidden" />

      <div class="flex flex-col gap-1">
        <h2 class="text-2xl font-bold text-gray-900">Bem-vindo de volta</h2>
        <p class="text-sm text-gray-400">Acesso restrito a administradores.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-700">E-mail</label>
          <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-md px-3 h-10 focus-within:ring-2 focus-within:ring-gray-900 focus-within:border-transparent transition-all">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px; color: #9ca3af; flex-shrink: 0;">mail</mat-icon>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="admin@naporta.com"
              style="flex: 1; font-size: 14px; color: #111827; outline: none; background: transparent; border: none;"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-700">Senha</label>
          <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-md px-3 h-10 focus-within:ring-2 focus-within:ring-gray-900 focus-within:border-transparent transition-all">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px; color: #9ca3af; flex-shrink: 0;">lock</mat-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              style="flex: 1; font-size: 14px; color: #111827; outline: none; background: transparent; border: none;"
            />
            <button type="button" (click)="showPassword = !showPassword" style="display: flex; align-items: center; color: #9ca3af; background: none; border: none; cursor: pointer; padding: 0;">
              <mat-icon style="font-size: 16px; width: 16px; height: 16px;">{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="flex items-center justify-center gap-2 bg-gray-900 text-white text-sm font-medium rounded-md hover:bg-gray-800 transition-colors active:scale-95 w-full"
          style="height: 40px;"
        >
          <mat-icon style="font-size: 16px; width: 16px; height: 16px;">login</mat-icon>
          Entrar
        </button>

      </form>

      <p class="text-xs text-gray-400 text-center lg:hidden">NaPorta, 2026</p>

    </div>
  </div>

</div>
