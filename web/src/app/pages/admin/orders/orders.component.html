<div class="flex flex-col mx-6 gap-8 py-12 px-8 lg:mx-16">

  <div class="flex flex-col gap-1">
    <h1 class="text-2xl font-bold text-gray-900">Pedidos</h1>
    <p class="text-xs text-gray-400">Acompanhe e atualize o status dos pedidos em tempo real.</p>
  </div>

  <div class="rounded-lg border border-gray-200 overflow-hidden bg-white">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 bg-gray-50">
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Quarto</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Hóspede</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Itens</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Total</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Horário</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Status</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let order of orders"
          class="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors"
        >
          <td class="px-4 py-3">
            <span class="font-medium text-gray-900">{{ order.room }}</span>
          </td>
          <td class="px-4 py-3">
            <span class="text-gray-700">{{ order.guest }}</span>
          </td>
          <td class="px-4 py-3">
            <div class="flex flex-col gap-0.5">
              <span *ngFor="let item of order.items" class="text-xs text-gray-500">
                {{ item.quantity }}x {{ item.name }}
              </span>
            </div>
          </td>
          <td class="px-4 py-3">
            <span class="font-medium text-gray-900">R$ {{ total(order).toFixed(2) }}</span>
          </td>
          <td class="px-4 py-3">
            <span class="text-xs text-gray-400">{{ order.created_at }}</span>
          </td>
          <td class="px-4 py-3">
            <span
              class="text-xs font-medium px-2.5 py-1 rounded-full"
              [ngClass]="statusConfig[order.status].classes"
            >
              {{ statusConfig[order.status].label }}
            </span>
          </td>
          <td class="px-4 py-3">
            <div class="flex items-center justify-end gap-1">
              <button
                *ngIf="order.status === 'pending'"
                (click)="updateStatus(order, 'preparing')"
                class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors"
              >
                <mat-icon style="font-size: 14px; width: 14px; height: 14px;">restaurant</mat-icon>
                Preparar
              </button>
              <button
                *ngIf="order.status === 'preparing'"
                (click)="updateStatus(order, 'delivered')"
                class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md bg-green-50 text-green-700 hover:bg-green-100 transition-colors"
              >
                <mat-icon style="font-size: 14px; width: 14px; height: 14px;">check_circle</mat-icon>
                Entregar
              </button>
              <button
                *ngIf="order.status === 'pending' || order.status === 'preparing'"
                (click)="updateStatus(order, 'cancelled')"
                class="inline-flex items-center justify-center w-7 h-7 rounded-md text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors"
                title="Cancelar"
              >
                <mat-icon style="font-size: 14px; width: 14px; height: 14px;">close</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
