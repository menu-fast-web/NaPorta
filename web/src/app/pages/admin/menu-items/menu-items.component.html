<div class="flex flex-col mx-6 gap-8 py-12 px-8 lg:mx-16">

  <div class="flex items-center justify-between">
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-bold text-gray-900">Cardápio</h1>
      <p class="text-xs text-gray-400">Gerencie os itens disponíveis para pedido.</p>
    </div>
    <button
      (click)="showForm = !showForm"
      class="inline-flex items-center gap-2 justify-center bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-md hover:bg-gray-800 transition-colors active:scale-95"
    >
      <mat-icon style="font-size: 16px; width: 16px; height: 16px;">{{ showForm ? 'close' : 'add' }}</mat-icon>
      {{ showForm ? 'Cancelar' : 'Novo item' }}
    </button>
  </div>

  <div *ngIf="showForm" class="rounded-lg border border-gray-200 bg-white p-6">
    <h2 class="text-sm font-semibold text-gray-900 mb-4">Novo item</h2>
    <form (ngSubmit)="submitForm()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-700">Nome</label>
        <input [(ngModel)]="form.name" name="name" type="text" placeholder="Ex: Filé de frango"
          style="font-size: 14px; color: #111827; outline: none; border: none;"
          class="bg-white border border-gray-200 rounded-md px-3 h-10 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-700">Preço</label>
        <input [(ngModel)]="form.price" name="price" type="number" step="0.01" placeholder="0.00"
          style="font-size: 14px; color: #111827; outline: none; border: none;"
          class="bg-white border border-gray-200 rounded-md px-3 h-10 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-700">Categoria</label>
        <select [(ngModel)]="form.category" name="category"
          style="font-size: 14px; color: #111827; outline: none; border: none;"
          class="bg-white border border-gray-200 rounded-md px-3 h-10 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all">
          <option value="breakfast">Café da manhã</option>
          <option value="lunch">Almoço</option>
          <option value="dinner">Jantar</option>
          <option value="drinks">Bebidas</option>
          <option value="snacks">Lanches</option>
        </select>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-700">URL da imagem</label>
        <input [(ngModel)]="form.image_url" name="image_url" type="text" placeholder="https://..."
          style="font-size: 14px; color: #111827; outline: none; border: none;"
          class="bg-white border border-gray-200 rounded-md px-3 h-10 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" />
      </div>

      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label class="text-xs font-medium text-gray-700">Descrição</label>
        <input [(ngModel)]="form.description" name="description" type="text" placeholder="Descrição do item"
          style="font-size: 14px; color: #111827; outline: none; border: none;"
          class="bg-white border border-gray-200 rounded-md px-3 h-10 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" />
      </div>

      <div class="sm:col-span-2 flex justify-end">
        <button type="submit"
          class="inline-flex items-center gap-2 justify-center bg-gray-900 text-white text-sm font-medium px-6 py-2.5 rounded-md hover:bg-gray-800 transition-colors active:scale-95">
          <mat-icon style="font-size: 16px; width: 16px; height: 16px;">save</mat-icon>
          Salvar
        </button>
      </div>

    </form>
  </div>

  <div class="rounded-lg border border-gray-200 overflow-hidden bg-white">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 bg-gray-50">
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Item</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Categoria</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Preço</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Status</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of items"
          class="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors"
        >
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <img [src]="item.image_url" [alt]="item.name" class="w-10 h-10 rounded-md object-cover shrink-0" />
              <div>
                <p class="font-medium text-gray-900">{{ item.name }}</p>
                <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">{{ item.description }}</p>
              </div>
            </div>
          </td>
          <td class="px-4 py-3">
            <span class="text-xs text-gray-500">{{ categoryLabel[item.category] }}</span>
          </td>
          <td class="px-4 py-3">
            <span class="font-medium text-gray-900">R$ {{ Number(item.price).toFixed(2) }}</span>
          </td>
          <td class="px-4 py-3">
            <span
              class="text-xs font-medium px-2.5 py-1 rounded-full"
              [ngClass]="item.available ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-400'"
            >
              {{ item.available ? 'Disponível' : 'Indisponível' }}
            </span>
          </td>
          <td class="px-4 py-3">
            <div class="flex items-center justify-end gap-1">
              <button
                (click)="toggleAvailable(item)"
                class="inline-flex items-center justify-center w-8 h-8 rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors"
                [title]="item.available ? 'Desativar' : 'Ativar'"
              >
                <mat-icon style="font-size: 16px; width: 16px; height: 16px;">{{ item.available ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <!-- <button
                (click)="deleteItem(item.id)"
                class="inline-flex items-center justify-center w-8 h-8 rounded-md text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors"
                title="Excluir"
              >
                <mat-icon style="font-size: 16px; width: 16px; height: 16px;">delete</mat-icon>
              </button> -->
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
