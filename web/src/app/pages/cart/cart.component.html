<div class="grid grid-rows-[auto_1fr] gap-4 md:gap-6">

  <!-- Cabeçalho do Carrinho -->
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-200 pb-3 md:pb-4 gap-2">
    <div class="flex items-center gap-2">
      <mat-icon class="text-gold-dark !w-6 !h-6">shopping_cart</mat-icon>
      <h1 class="font-bold text-xl md:text-2xl text-gold-dark">
        Meu Carrinho
      </h1>
    </div>
    <span class="text-xs md:text-sm text-gray-500">1 produto</span>
  </div>

  <!-- Conteúdo Principal -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">

    <!-- Listagem de Produtos do Carrinho -->
    <section class="lg:col-span-2 flex flex-col gap-4">
      <div
        class="bg-white rounded-xl shadow-md shadow-[#C79B2B]/20 p-4 md:p-6 flex flex-col sm:flex-row gap-4 items-start">

        <!-- Seleção do Item -->
        <input type="checkbox" checked class="w-4 h-4 mt-1 accent-[#C79B2B] cursor-pointer shrink-0" />

        <!-- Imagem do Produto -->
        <img src="assets/images/card-menu.avif" alt="Filé de frango a milanesa"
          class="w-full sm:w-28 h-28 object-cover rounded-xl bg-gray-50 border border-gray-200 shrink-0">

        <!-- Detalhes do Produto -->
        <div class="flex flex-col gap-2 flex-1 w-full">
          <p class="font-semibold text-sm md:text-base text-gray-900">
            Filé de frango a milanesa
          </p>

          <!-- Controle de Quantidade -->
          <div class="flex items-center gap-2">
            <label class="text-xs md:text-sm text-gray-500">Qtd:</label>
            <input type="number" min="1" max="10" value="1"
              class="w-16 border border-gray-200 rounded-md px-2 py-1 text-xs md:text-sm outline-none focus:border-[#F1C24A] focus:ring-1 focus:ring-[#F9E446]" />
          </div>

          <!-- Subtotal do Item e Ação de Remoção -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mt-auto">
            <p class="text-xs md:text-sm text-gray-500">
              Subtotal:
              <span class="font-bold text-gray-900">R$ 29,90</span>
            </p>
            <button
              class="flex items-center gap-1 text-xs font-semibold text-red-500 hover:text-red-700 hover:underline transition-all active:scale-95">
              <mat-icon class="!text-sm !w-4 !h-4">delete</mat-icon>
              Remover
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Resumo do Pedido (Checkout Sidebar) -->
    <aside class="lg:col-span-1">
      <div class="bg-white p-4 md:p-5 rounded-xl shadow-md shadow-[#C79B2B]/20 flex flex-col gap-4 sticky top-4">

        <h2 class="font-bold text-base md:text-lg text-gold-dark border-b border-gray-200 pb-3">
          Resumo do Pedido
        </h2>

        <!-- Tabela de Valores -->
        <div class="flex flex-col gap-3 text-sm text-gray-600">
          <div class="flex justify-between items-center">
            <span>Itens (1)</span>
            <span class="font-medium text-gray-900">R$ 29,90</span>
          </div>
        </div>

        <!-- Total do Pedido -->
        <div class="border-t border-gray-100 pt-4 mt-2">
          <div class="flex justify-between items-baseline mb-1">
            <span class="text-gray-900 font-bold text-base">Valor Total</span>
            <span class="text-gray-900 font-black text-2xl tracking-tight">R$ 29,90</span>
          </div>
        </div>

        <!-- Ações do Pedido -->
        <div class="flex flex-col gap-3 my-2">
          <button
            class="bg-gray-500 text-white flex items-center justify-center rounded-md w-full py-3.5 border-2 border-transparent hover:bg-white hover:border-gold-dark hover:text-gold-dark cursor-pointer outline-none transition-all duration-200">
            Finalizar Compra
          </button>
          <p class="text-center text-xs text-gray-400 font-medium">ou</p>
          <button routerLink="/menu"
            class="bg-white text-gold-dark flex items-center justify-center rounded-md w-full py-3.5 border-2 border-gold-dark hover:bg-gray-100 hover:border-gold-dark hover:text-gold-dark cursor-pointer outline-none transition-all duration-200">
            Continuar Comprando
          </button>
        </div>

        <!-- Compra Segura -->
        <p class="flex items-center justify-center gap-1.5 text-xs text-gray-500">
          <mat-icon class="!text-sm !w-4 !h-4 text-green-500">verified_user</mat-icon>
          Compra 100% segura e protegida
        </p>
      </div>
    </aside>
  </div>
</div>
