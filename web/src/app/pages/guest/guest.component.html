<div class="flex flex-col items-center justify-center min-h-screen gap-4">
  <ng-container *ngIf="!error">
    <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #9ca3af;">hourglass_top</mat-icon>
    <p class="text-sm text-gray-400">Identificando hóspede...</p>
  </ng-container>

  <ng-container *ngIf="error">
    <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #ef4444;">error_outline</mat-icon>
    <p class="text-sm text-gray-500">QRCode inválido ou hóspede não encontrado.</p>
    <button routerLink="/" class="inline-flex items-center justify-center bg-gray-900 text-white text-sm font-medium px-6 py-2.5 rounded-md hover:bg-gray-800 transition-colors">
      Voltar ao início
    </button>
  </ng-container>
</div>
