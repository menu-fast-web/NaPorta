<header class="flex flex-col items-center w-full gap-6 mb-6">
  <div class="relative w-full max-w-md">
    <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">search</mat-icon>
    <input
      type="text"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
      placeholder="O que vai pedir hoje?"
      class="w-full bg-white rounded-2xl shadow-md py-4 pl-12 pr-4 border-0 outline-none focus:ring-2 focus:ring-blue-700/20 transition-all"
    />
  </div>

  <div class="flex items-center gap-3 w-full">
    <span class="h-px flex-1 bg-gradient-to-r from-transparent to-zinc-800"></span>
    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-[#111827] text-white shadow-md">
      <mat-icon>restaurant_menu</mat-icon>
    </div>
    <span class="h-px flex-1 bg-gradient-to-l from-transparent to-zinc-800"></span>
  </div>
</header>

<section class="flex flex-col mb-8 gap-16">

  <div *ngIf="!search">
    <h2 class="text-lg font-bold mb-4 text-gray-900 px-8 flex items-center gap-2">
      <mat-icon style="font-size: 20px; width: 20px; height: 20px">workspace_premium</mat-icon>
      Top 3 Pedidos da Casa
    </h2>
    <div class="grid grid-cols-3 gap-4">
      <div
        *ngFor="let item of top3"
        class="bg-white rounded-2xl shadow-sm overflow-hidden text-black transition-all duration-300 hover:shadow-xl hover:-translate-y-1 cursor-pointer"
      >
        <img [src]="item.image_url" [alt]="item.name" class="w-full h-44 object-cover" />
        <div class="p-4 flex flex-col gap-2">
          <p class="text-base font-semibold leading-tight">{{ item.name }}</p>
          <p class="text-gray-400 text-xs leading-relaxed line-clamp-2">{{ item.description }}</p>
          <div class="flex items-center justify-between mt-1">
            <p class="text-base font-bold text-gray-900">R$ {{ Number(item.price).toFixed(2) }}</p>
            <button (click)="addToCart(item)" class="inline-flex items-center justify-center bg-transparent border border-gray-900 text-gray-900 text-xs font-medium px-4 py-2 rounded-full hover:bg-gray-900 hover:text-white transition-all duration-200 active:scale-95">
              Adicionar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="rounded-lg border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 bg-gray-50">
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Refeição</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Informações</th>
          <th class="text-left text-xs font-medium text-gray-500 px-4 py-3">Preço</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of pagedItems"
          class="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors"
        >
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <img [src]="item.image_url" [alt]="item.name" class="w-10 h-10 rounded-md object-cover" />
              <div>
                <p class="font-medium text-gray-900">{{ item.name }}</p>
                <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">{{ item.description }}</p>
              </div>
            </div>
          </td>
          <td class="px-4 py-3">
            <span class="text-xs text-gray-400">{{ categoryLabel[item.category] }}</span>
          </td>
          <td class="px-4 py-3">
            <p class="font-medium text-gray-900">R$ {{ Number(item.price).toFixed(2) }}</p>
          </td>
          <td class="px-4 py-3 text-right">
            <button (click)="addToCart(item)" class="inline-flex items-center justify-center bg-gray-900 text-white text-xs font-medium px-4 py-2 rounded-md hover:bg-gray-800 transition-colors active:scale-95">
              Adicionar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="totalPages > 1" class="flex items-center justify-center gap-1 mt-8">
    <button
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <mat-icon class="!text-base !w-4 !h-4">chevron_left</mat-icon>
    </button>
    <button
      *ngFor="let page of pages"
      (click)="goToPage(page)"
      [class]="page === currentPage
        ? 'inline-flex items-center justify-center w-9 h-9 rounded-md bg-gray-900 text-white text-sm font-medium'
        : 'inline-flex items-center justify-center w-9 h-9 rounded-md text-gray-500 text-sm font-medium hover:bg-gray-100 transition-colors'"
    >
      {{ page }}
    </button>
    <button
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <mat-icon class="!text-base !w-4 !h-4">chevron_right</mat-icon>
    </button>
  </div>

</section>
