<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">

    <!-- Listagem de Itens (Coluna da Esquerda) -->
    <section class="lg:col-span-2 flex flex-col gap-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col gap-4">
            <h2 class="font-bold text-xl md:text-2xl text-gray-900 border-b border-gray-100 pb-3">Itens do Pedido</h2>

            <!-- Item do Pedido (Mesmo prato do carrinho) -->
            <div class="flex flex-col sm:flex-row gap-4 items-start py-2">
                <img src="assets/images/card-menu.avif" alt="Filé de frango a milanesa"
                    class="w-full sm:w-28 h-28 object-cover rounded-xl bg-gray-50 border border-gray-200 shrink-0">
                <div class="flex flex-col gap-2 flex-1 w-full">
                    <p class="font-semibold text-sm md:text-base text-gray-900">Filé de frango a milanesa</p>
                    <div class="flex justify-between items-center text-xs md:text-sm text-gray-500">
                        <span>Quantidade: 1</span>
                        <span class="font-bold text-gray-900">R$ 29,90</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Resumo do Pedido / Sidebar de Detalhes (Coluna da Direita) -->
    <aside class="lg:col-span-1">
        <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4 sticky top-4">

            <h2 class="font-bold text-base md:text-lg text-gray-900 border-b border-gray-200 pb-3">
                Resumo do Pedido
            </h2>

            <!-- Previsão de Entrega -->
            <div class="flex flex-col gap-1.5 p-4 rounded-xl bg-gray-50/50 border border-gray-100">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Previsão de Entrega</span>
                <div class="flex items-center gap-2">
                    <mat-icon class="text-blue-500 flex items-center justify-center"
                        style="font-size: 20px; width: 20px; height: 20px;">schedule</mat-icon>
                    <span class="font-bold text-base text-gray-900">30 a 40 minutos</span>
                </div>
            </div>

            <!-- Total Pago -->
            <div class="flex flex-col gap-1.5 p-4 rounded-xl bg-gray-50/50 border border-gray-100">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Valor Pago</span>
                <div class="flex items-baseline gap-1.5">
                    <span class="font-black text-2xl text-gray-900">R$ 29,90</span>
                </div>
            </div>

            <!-- Ações do Acompanhamento -->
            <div class="flex flex-col gap-3 my-2">
                <button routerLink="/menu" class="btn-primary w-full">
                    <mat-icon class="!text-lg">arrow_back</mat-icon>
                    Voltar para o Cardápio
                </button>
            </div>

        </div>
    </aside>

</div>
