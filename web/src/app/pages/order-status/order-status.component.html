<div class="max-w-2xl mx-auto flex flex-col gap-6 md:gap-8">

    <!-- Cabeçalho da Página -->
    <div class="flex flex-col gap-1">
        <h1 class="font-bold text-2xl text-gray-900">Acompanhar Pedido</h1>
        <p class="text-xs text-gray-400">Pedido realizado hoje às 20:38</p>
    </div>

    <!-- Detalhes do Pedido e Resumo de Valores -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col gap-4">
        <h2 class="font-bold text-lg text-gray-900 border-b border-gray-100 pb-3">Itens do Pedido</h2>

        <!-- Item do Pedido (Mesmo prato do carrinho) -->
        <div class="flex gap-4 items-center py-2">
            <img src="assets/images/card-menu.avif" alt="Filé de frango a milanesa"
                class="w-24 h-24 object-cover rounded-xl bg-gray-50 border border-gray-100 shrink-0">
            <div class="flex flex-col gap-1 flex-1">
                <p class="font-semibold text-sm text-gray-900">Filé de frango a milanesa</p>
                <div class="flex justify-between items-center text-xs text-gray-500">
                    <span>Quantidade: 1</span>
                    <span class="font-semibold text-gray-900">R$ 29,90</span>
                </div>
            </div>
        </div>

        <div class="border-t border-gray-100 my-2"></div>

        <!-- Preço Pago e Previsão de Entrega -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-gray-600 mt-2">

            <!-- Preço Pago -->
            <div class="flex flex-col gap-1.5 p-4 rounded-xl bg-gray-50/50 border border-gray-100">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Valor Pago</span>
                <div class="flex items-baseline gap-1.5">
                    <span class="font-black text-2xl text-gray-900">R$ 29,90</span>
                </div>
            </div>

            <!-- Previsão de Entrega -->
            <div class="flex flex-col gap-1.5 p-4 rounded-xl bg-gray-50/50 border border-gray-100">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Previsão de Entrega</span>
                <div class="flex items-center gap-2">
                    <mat-icon class="text-blue-500 flex items-center justify-center"
                        style="font-size: 20px; width: 20px; height: 20px;">schedule</mat-icon>
                    <span class="font-bold text-base md:text-lg text-gray-900">30 a 40 minutos</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Ações e Navegação -->
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between mt-2">
        <button routerLink="/menu" class="btn-primary w-full sm:w-auto">
            <mat-icon class="!text-lg">arrow_back</mat-icon>
            Voltar para o Cardápio
        </button>
        <button class="btn-secondary w-full sm:w-auto">
            <mat-icon class="!text-lg">chat_bubble_outline</mat-icon>
            Precisa de ajuda?
        </button>
    </div>
</div>
