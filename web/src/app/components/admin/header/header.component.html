<header class="flex items-center justify-between px-8 py-4 bg-white shadow-sm">
  <a routerLink="/admin/dashboard" class="no-underline hover:text-black">
    <div class="flex items-center justify-center gap-3">
      <img src="assets/images/logo.svg" alt="Logo" class="w-20 h-20 rounded-full" />
      <div class="flex flex-col">
        <span class="text-2xl">NA<span class="text-gray-900 font-bold">PORTA</span></span>
        <span class="text-xs text-gray-400 -mt-1">Administração</span>
      </div>
    </div>
  </a>

  <nav class="flex items-center">
    <a
      routerLink="/admin/dashboard"
      routerLinkActive="text-gray-900 font-medium"
      class="flex items-center gap-1.5 text-sm text-gray-500 px-4 py-2 rounded-md transition-colors no-underline"
    >
      <mat-icon style="font-size: 18px; width: 18px; height: 18px">dashboard</mat-icon>
      Dashboard
    </a>
    <a
      routerLink="/admin/orders"
      routerLinkActive="text-gray-900 font-medium"
      class="flex items-center gap-1.5 text-sm text-gray-500 px-4 py-2 rounded-md transition-colors no-underline"
    >
      <mat-icon style="font-size: 18px; width: 18px; height: 18px">receipt_long</mat-icon>
      Pedidos
    </a>
    <a
      routerLink="/admin/menu-items"
      routerLinkActive="text-gray-900 font-medium"
      class="flex items-center gap-1.5 text-sm text-gray-500 px-4 py-2 rounded-md transition-colors no-underline"
    >
      <mat-icon style="font-size: 18px; width: 18px; height: 18px">menu_book</mat-icon>
      Cardápio
    </a>
  </nav>

  <button (click)="logout()" class="flex items-center gap-1.5 text-sm text-gray-500 px-4 py-2 rounded-md hover:bg-gray-100 transition-colors">
    <mat-icon style="font-size: 18px; width: 18px; height: 18px">logout</mat-icon>
    Sair
  </button>
</header>
